services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://igniteinsights:igniteinsights@db:5432/igniteinsights
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      API_BASE_URL: http://api:8000
      # Better Auth (docs/producto.md §4): sessions live in the same Postgres.
      DATABASE_URL: postgresql://igniteinsights:igniteinsights@db:5432/igniteinsights
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me-in-production}
    depends_on:
      - api
    restart: unless-stopped

  elmfire-runner:
    build: ../elmfire-runner
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
    environment:
      ELMFIRE_SCRATCH_BASE: /tmp/elmfire_scratch
    restart: unless-stopped

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: igniteinsights
      POSTGRES_USER: igniteinsights
      POSTGRES_PASSWORD: igniteinsights
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U igniteinsights"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Isolated, disposable database for Playwright. Keeping it off the development volume
  # prevents the deterministic E2E admin and test sessions from leaking into normal use.
  db-e2e:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: igniteinsights
      POSTGRES_USER: igniteinsights
      POSTGRES_PASSWORD: igniteinsights
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U igniteinsights"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
