services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://igniteinsights:igniteinsights@db:5432/igniteinsights
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: igniteinsights
      POSTGRES_USER: igniteinsights
      POSTGRES_PASSWORD: igniteinsights
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U igniteinsights"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
