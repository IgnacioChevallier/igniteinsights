services:
  api:
    volumes:
      - ./app:/app/app
      - ./benchmarks:/app/benchmarks
    command:
      - /app/.venv/bin/uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app
    restart: "no"

  frontend:
    image: igniteinsights-frontend-dev
    build:
      context: ./frontend
      target: development
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      API_BASE_URL: http://api:8000
      DATABASE_URL: postgresql://igniteinsights:igniteinsights@db:5432/igniteinsights
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me-in-production}
    restart: "no"

  elmfire-runner:
    restart: "no"

volumes:
  frontend_node_modules:
  frontend_next:
